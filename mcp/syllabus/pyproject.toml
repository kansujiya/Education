[project]
name = "mcp-syllabus"
version = "0.1.0"
description = "MCP server: fetch and parse exam syllabi"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "pydantic>=2.7",
    "shared",
]

[project.scripts]
mcp-syllabus = "mcp_syllabus.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_syllabus"]
