[project]
name = "mcp-mindmap"
version = "0.1.0"
description = "MCP server: render mind-map node trees to Mermaid text + radial SVG"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "pydantic>=2.7",
    "shared",
]

[project.scripts]
mcp-mindmap = "mcp_mindmap.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_mindmap"]
