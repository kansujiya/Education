[project]
name = "mcp-pyq"
version = "0.1.0"
description = "MCP server: search past-year exam questions"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "pydantic>=2.7",
    "shared",
]

[project.scripts]
mcp-pyq = "mcp_pyq.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_pyq"]
