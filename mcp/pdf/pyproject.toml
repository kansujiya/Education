[project]
name = "mcp-pdf"
version = "0.1.0"
description = "MCP server: bundle a topic's lesson + mindmap + cards into a downloadable archive"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "pydantic>=2.7",
    "shared",
]

[project.scripts]
mcp-pdf = "mcp_pdf.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_pdf"]
