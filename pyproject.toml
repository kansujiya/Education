[project]
name = "education-ai"
version = "0.1.0"
description = "Agentic AI exam-prep companion"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["apps/*", "mcp/*", "packages/*"]

[tool.uv.sources]
shared = { workspace = true }
api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["apps", "packages", "mcp"]
asyncio_mode = "auto"
