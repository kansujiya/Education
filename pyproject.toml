[project]
name = "education-ai"
version = "0.1.0"
description = "Agentic AI exam-prep companion"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["apps/api", "mcp/*", "packages/*"]
# apps/web is a Node project (pnpm), not a Python workspace member.

[tool.uv.sources]
shared = { workspace = true }
api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends() idiom looks like B008 to ruff but is the official pattern.
"apps/api/src/api/web/**" = ["B008"]
# Tests can use long lines / unused-arg fixtures freely.
"apps/api/tests/**" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Optional observability deps — ignore missing imports so mypy passes
# on machines that haven't installed them.
module = [
    "opentelemetry.*",
    "sentry_sdk.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["apps", "packages", "mcp"]
asyncio_mode = "auto"
