[project]
name = "api"
version = "0.1.0"
description = "Education AI FastAPI app + agent runtime + CLI"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "shared",
    "typer>=0.12",
    "rich>=13.7",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "redis>=5.0",
    "mcp>=1.0",
    "fastapi>=0.115",
    "sse-starlette>=2.1",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "uvicorn>=0.30",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "mypy>=1.11",
    "ruff>=0.6",
    "aiosqlite>=0.20",
    "fakeredis>=2.20",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
]

[project.scripts]
edu = "api.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
