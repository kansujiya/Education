name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.17"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install workspaces
        run: uv sync --all-packages --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy strict
        run: |
          uv run mypy packages/shared/src apps/api/src \
            mcp/syllabus/src mcp/mindmap/src mcp/pyq/src mcp/stats/src mcp/pdf/src

      - name: Pytest
        run: uv run pytest -q

      - name: Alembic migrations apply on SQLite
        run: |
          cd infra/alembic
          uv run alembic upgrade head
          uv run alembic downgrade base

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
